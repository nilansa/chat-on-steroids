name: Upstream sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream after compatibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream and prepare a candidate merge
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/totec448-spec/chat-on-steroids.git
          git fetch --no-tags upstream main
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already current with upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort || true
            echo "::error::Upstream merge conflict. main was not changed; resolve the conflict before retrying."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: npm ci

      - name: Full upstream verification
        if: steps.sync.outputs.changed == 'true'
        run: npm run verify:ci

      - name: Build the application
        if: steps.sync.outputs.changed == 'true'
        run: npm run build

      - name: Publish verified upstream update
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo "## Chat On Steroids upstream sync"
            echo
            echo "- Upstream: totec448-spec/chat-on-steroids"
            echo "- Upstream commit: ${{ steps.sync.outputs.upstream_sha || 'not fetched' }}"
            echo "- Candidate merged: ${{ steps.sync.outputs.changed || 'no' }}"
            echo "- Publish occurs only after full verification and build succeed."
            echo "- Merge conflicts or failed checks leave main unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
